name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Check that the ref is the tag of the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import req_metrics as rq, torch; r = rq.compute({0: torch.randn(200, 16)}, ['effective_rank', 'intrinsic_dimension/twonn']); print(rq.__version__, len(rq.list_metrics()), [x.value for x in r])"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/req-metrics/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
